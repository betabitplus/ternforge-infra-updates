name: full-fleet updates

on:
  repository_dispatch:
    types: [ternforge-release]
  schedule:
    # The official :maintainLockFilesMonthly preset allows the first day of the
    # month before 04:00 UTC. This nightly run therefore enters that window.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile full fleet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: renovate
    steps:
      - name: Capture queue timing
        id: timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started_epoch="$(date -u +%s)"
          created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')"
          created_epoch="$(date -u -d "$created_at" +%s)"
          queue_seconds="$((started_epoch - created_epoch))"
          printf 'started_epoch=%s\n' "$started_epoch" >> "$GITHUB_OUTPUT"
          printf 'queue_seconds=%s\n' "$queue_seconds" >> "$GITHUB_OUTPUT"

      - name: Check out update configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out current inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: betabitplus/ternforge-infra-repository-control
          ref: main
          path: .inventory
          persist-credentials: false

      - name: Validate and export exact managed fleet
        id: fleet
        run: |
          set -euo pipefail
          inventory_sha="$(git -C .inventory rev-parse HEAD)"
          inventory=.inventory/fleet.auto.tfvars.json
          jq -e '.repositories | type == "array" and length > 0 and length < 500' "$inventory" >/dev/null
          jq -e 'all(.repositories[]; ((.repository | type) == "string") and (.repository | test("^betabitplus/[a-z0-9][a-z0-9-]*$")))' "$inventory" >/dev/null

          jq -r '.repositories[].repository' "$inventory" > "$RUNNER_TEMP/fleet.actual"
          LC_ALL=C sort "$RUNNER_TEMP/fleet.actual" > "$RUNNER_TEMP/fleet.sorted"
          cmp "$RUNNER_TEMP/fleet.actual" "$RUNNER_TEMP/fleet.sorted"
          test "$(wc -l < "$RUNNER_TEMP/fleet.actual" | tr -d ' ')" = "$(LC_ALL=C sort -u "$RUNNER_TEMP/fleet.actual" | wc -l | tr -d ' ')"

          repositories_json="$(jq -c '[.repositories[].repository]' "$inventory")"
          repository_count="$(jq '.repositories | length' "$inventory")"
          {
            printf 'inventory_sha=%s\n' "$inventory_sha"
            printf 'repositories_json=%s\n' "$repositories_json"
            printf 'repository_count=%s\n' "$repository_count"
            printf 'repository_names<<EOF\n'
            jq -r '.repositories[].repository | split("/")[1]' "$inventory"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Create exact-fleet Renovate token
        id: renovate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TERNFORGE_RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.TERNFORGE_RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.fleet.outputs.repository_names }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Verify exact Renovate token repository set
        id: token-scope
        env:
          EXPECTED_REPOSITORIES: ${{ steps.fleet.outputs.repositories_json }}
          GH_TOKEN: ${{ steps.renovate-token.outputs.token }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_REPOSITORIES" | jq -r '.[]' | LC_ALL=C sort > "$RUNNER_TEMP/expected-repositories"
          gh api installation/repositories --paginate --jq '.repositories[].full_name' | LC_ALL=C sort > "$RUNNER_TEMP/token-repositories"
          observed_count="$(wc -l < "$RUNNER_TEMP/token-repositories" | tr -d ' ')"
          if cmp -s "$RUNNER_TEMP/expected-repositories" "$RUNNER_TEMP/token-repositories"; then
            scope_ok=1
          else
            scope_ok=0
          fi
          printf 'observed_count=%s\n' "$observed_count" >> "$GITHUB_OUTPUT"
          printf 'scope_ok=%s\n' "$scope_ok" >> "$GITHUB_OUTPUT"
          diff -u "$RUNNER_TEMP/expected-repositories" "$RUNNER_TEMP/token-repositories"

      - name: Create source-read dependency token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Export source-read dependency token as Renovate secret
        env:
          SOURCE_READ_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          renovate_secrets="$(jq -nc --arg token "$SOURCE_READ_TOKEN" '{"SOURCE_READ_TOKEN": $token}')"
          printf 'RENOVATE_SECRETS=%s\n' "$renovate_secrets" >> "$GITHUB_ENV"

      - name: Reconcile current full fleet
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ steps.fleet.outputs.repositories_json }}
        with:
          configurationFile: renovate/config.js
          token: ${{ steps.renovate-token.outputs.token }}
          renovate-version: 44.7.2@sha256:e23f94ca319706e434ca693f3d28674a6749158c6bb761abd76ad4e81255c7ec
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$'

      - name: Export bounded Fleet Health metrics
        id: telemetry_export
        if: always()
        continue-on-error: true
        env:
          GRAFANA_OTLP_ENDPOINT: ${{ vars.TERNFORGE_GRAFANA_OTLP_ENDPOINT }}
          GRAFANA_OTLP_USERNAME: ${{ vars.TERNFORGE_GRAFANA_OTLP_USERNAME }}
          GRAFANA_OTLP_PASSWORD: ${{ secrets.TERNFORGE_GRAFANA_OTLP_PASSWORD }}
          EXPECTED_REPOSITORIES: ${{ steps.fleet.outputs.repository_count }}
          EXPECTED_REPOSITORY_NAMES: ${{ steps.fleet.outputs.repositories_json }}
          GH_TOKEN: ${{ steps.renovate-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          OBSERVED_REPOSITORIES: ${{ steps.token-scope.outputs.observed_count }}
          QUEUE_SECONDS: ${{ steps.timing.outputs.queue_seconds }}
          SCOPE_OK: ${{ steps.token-scope.outputs.scope_ok }}
          STARTED_EPOCH: ${{ steps.timing.outputs.started_epoch }}
        run: |
          set -euo pipefail
          echo 'status=disabled' >> "$GITHUB_OUTPUT"
          if test -z "$GRAFANA_OTLP_ENDPOINT" || test -z "$GRAFANA_OTLP_USERNAME" || test -z "$GRAFANA_OTLP_PASSWORD"; then
            exit 0
          fi
          echo 'status=failed' >> "$GITHUB_OUTPUT"
          now="$(date -u +%s)"
          total_seconds="$((now - ${STARTED_EPOCH:-now}))"
          queue_seconds="${QUEUE_SECONDS:-0}"
          expected="${EXPECTED_REPOSITORIES:-null}"
          observed="${OBSERVED_REPOSITORIES:-null}"
          scope_ok="${SCOPE_OK:-null}"
          if test "$JOB_STATUS" = success; then
            run_success=1
            last_success="$now"
          else
            run_success=0
            last_success=null
          fi
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch) trigger=release ;;
            schedule) trigger=nightly ;;
            workflow_dispatch) trigger=manual ;;
            *) trigger=manual ;;
          esac
          warning_count=null
          if test "$scope_ok" = 1 && test -n "$EXPECTED_REPOSITORY_NAMES"; then
            if warning_readback="$(
              gh api -X GET search/issues --paginate \
                -f q="user:${GITHUB_REPOSITORY_OWNER} is:issue is:open label:renovate/config-error" 2>/dev/null \
                | jq -s --argjson expected "$EXPECTED_REPOSITORY_NAMES" '
                    [.[].items[].repository_url
                      | sub("^https://api.github.com/repos/"; "")
                      | select(. as $repository | $expected | index($repository))]
                    | length
                  '
            )" && [[ "$warning_readback" =~ ^[0-9]+$ ]]; then
              warning_count="$warning_readback"
            fi
          fi
          timestamp_ns="${now}000000000"

          payload="$(jq -n \
            --arg trigger "$trigger" \
            --arg timestamp "$timestamp_ns" \
            --argjson total "$total_seconds" \
            --argjson queue "$queue_seconds" \
            --argjson success "$run_success" \
            --argjson lastSuccess "$last_success" \
            --argjson expected "$expected" \
            --argjson observed "$observed" \
            --argjson scopeOk "$scope_ok" \
            --argjson warnings "$warning_count" '
              def trigger_attributes: [{key: "ternforge.trigger", value: {stringValue: $trigger}}];
              def point($value; $attributes): {timeUnixNano: $timestamp, asDouble: $value, attributes: $attributes};
              def gauge($name; $value; $attributes): {name: $name, gauge: {dataPoints: [point($value; $attributes)]}};
              def scope($metrics): {scope: {name: "ternforge.fleet-health", version: "1"}, metrics: $metrics};
              def resource($metrics): {
                resource: {attributes: [{key: "service.name", value: {stringValue: "ternforge-update"}}]},
                scopeMetrics: [scope($metrics)]
              };
              {
                resourceMetrics: [
                  resource(([
                    gauge("ternforge_update_processing_duration_seconds"; $total; trigger_attributes),
                    gauge("ternforge_update_queue_delay_seconds"; $queue; trigger_attributes),
                    gauge("ternforge_update_run_success"; $success; trigger_attributes)
                  ] + (if $expected != null and $observed != null and $scopeOk != null then [
                    gauge("ternforge_fleet_expected_repositories"; $expected; []),
                    gauge("ternforge_fleet_observed_repositories"; $observed; []),
                    gauge("ternforge_fleet_token_scope_ok"; $scopeOk; [])
                  ] else [] end) + (if $warnings != null then [
                    gauge("ternforge_renovate_configuration_warnings"; $warnings; [])
                  ] else [] end) + (if $lastSuccess != null then [
                    gauge("ternforge_update_last_success_unixtime"; $lastSuccess; [])
                  ] else [] end)))
                ]
              }
            ')"
          curl -fsS \
            --retry 3 \
            --retry-all-errors \
            --user "$GRAFANA_OTLP_USERNAME:$GRAFANA_OTLP_PASSWORD" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            "${GRAFANA_OTLP_ENDPOINT%/}/v1/metrics" >/dev/null
          echo 'status=exported' >> "$GITHUB_OUTPUT"

      - name: Record native execution evidence
        if: always()
        env:
          INVENTORY_SHA: ${{ steps.fleet.outputs.inventory_sha }}
          QUEUE_SECONDS: ${{ steps.timing.outputs.queue_seconds }}
          REPOSITORY_COUNT: ${{ steps.fleet.outputs.repository_count }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          STARTED_EPOCH: ${{ steps.timing.outputs.started_epoch }}
          TELEMETRY_STATUS: ${{ steps.telemetry_export.outputs.status }}
        run: |
          set -euo pipefail
          finished_epoch="$(date -u +%s)"
          total_seconds="$((finished_epoch - STARTED_EPOCH))"
          {
            echo '## Full-fleet reconciliation evidence'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            printf '| Trigger | %s |\n' "$GITHUB_EVENT_NAME"
            printf '| Inventory commit | %s |\n' "${INVENTORY_SHA:-unresolved}"
            printf '| Managed repositories | %s |\n' "${REPOSITORY_COUNT:-unknown}"
            printf '| Queue seconds | %s |\n' "${QUEUE_SECONDS:-unknown}"
            printf '| Total job seconds | %s |\n' "$total_seconds"
            printf '| Fleet Health telemetry | %s |\n' "${TELEMETRY_STATUS:-unknown}"
            printf '| Audit source repository | %s |\n' "${SOURCE_REPOSITORY:-n/a}"
            printf '| Audit source ref | %s |\n' "${SOURCE_REF:-n/a}"
            printf '| Audit source SHA | %s |\n' "${SOURCE_SHA:-n/a}"
            echo
            echo 'Per-repository detail remains in native Renovate/GitHub evidence; telemetry is best-effort and never changes reconciliation correctness.'
          } >> "$GITHUB_STEP_SUMMARY"
