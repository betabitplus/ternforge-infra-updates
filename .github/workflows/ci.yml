name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  required:
    name: ci / required
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Validate workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate Renovate configuration
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/renovatebot/renovate:44.7.2@sha256:e23f94ca319706e434ca693f3d28674a6749158c6bb761abd76ad4e81255c7ec \
            renovate-config-validator --strict \
            renovate/config.js presets/python-library.json5

      - name: Validate Grafana OpenTofu
        working-directory: grafana
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate

      - name: Validate pinned Collector configuration
        env:
          OTEL_IMAGE: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
        run: |
          set -euo pipefail
          docker run --rm \
            -e GRAFANA_OTLP_ENDPOINT=https://example.invalid/otlp \
            -e GRAFANA_OTLP_USERNAME=123456 \
            -e GRAFANA_OTLP_PASSWORD=redacted \
            -v "$PWD/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro" \
            "$OTEL_IMAGE" \
            validate --config=/etc/otelcol-contrib/config.yaml

      - name: Verify repository files
        run: |
          set -euo pipefail
          git diff --check
          node --check renovate/config.js
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null
          python -m json.tool observability/fleet-health-dashboard.json >/dev/null
          test -s .copier-answers.yml
          test -s README.md
          test -s presets/python-library.json5
          test -s observability/otel-collector.yml
          test -s grafana/.terraform.lock.hcl
          ! grep -E 'attributes\["(repository|branch|command|path|sha|run[_ -]?id)"\]|^[[:space:]]*- name: (repository|branch|command|path|sha|run[_ -]?id)' observability/otel-collector.yml
